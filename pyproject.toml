[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-engine-flight-pipeline"
version = "0.1.0"
description = "Small ETL pipeline for aviation flight data ingestion and processing"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.32,<3.0",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5,<4.0",
]

dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=4.0,<5.0",
    "ruff>=0.6,<1.0",
]